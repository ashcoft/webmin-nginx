# This repository is a Webmin module written in Perl (the CGIs and helper
# library under nginx/). It has no test suite, so CI checks that every Perl
# file still compiles.
version: 2.1

jobs:
  perl-syntax:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Perl syntax check
          command: sh tools/check-perl.sh

workflows:
  ci:
    jobs:
      - perl-syntax
